<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundry339 — Alloy Mixer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F172A; --slate:#1E293B; --molten:#FF3503; --pale:#E5E7EB; --temper:#2DD4BF;
    --grid-line: rgba(229,231,235,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--slate); color:var(--pale); font-family:'Inter', sans-serif; line-height:1.5;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    padding: 28px;
  }
  .section-tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#64748B; margin-bottom:8px; }
  h2{ font-family:'Archivo Black', sans-serif; font-size:20px; margin-bottom:20px; max-width:520px; }
  .pill{
    font-family:'Inter', sans-serif; font-size:13px; padding:8px 14px; border-radius:4px;
    border:1px solid rgba(229,231,235,0.18); background:transparent; color:var(--pale);
    cursor:pointer; transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .pill:hover{border-color:var(--temper);}
  .pill.active{ background:var(--temper); border-color:var(--temper); color:var(--ink); font-weight:600; }
  .alloy-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .field-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#94A3B8; }
  input[type=color]{
    -webkit-appearance:none; width:40px; height:40px; border:2px solid rgba(229,231,235,0.2);
    border-radius:50%; background:none; cursor:pointer; padding:0;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0; border-radius:50%; }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:50%; }
  .swatch-row{ display:flex; border-radius:6px; overflow:hidden; margin-bottom:22px; border:1px solid rgba(229,231,235,0.1); }
  .swatch{ flex:1; height:64px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:rgba(255,255,255,0.75); }
  .contrast-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  @media (max-width:480px){ .contrast-grid{grid-template-columns:1fr;} }
  .contrast-card{ border:1px solid rgba(229,231,235,0.12); border-radius:6px; padding:14px; }
  .contrast-preview{ border-radius:4px; padding:12px; font-family:'Inter', sans-serif; font-weight:600; font-size:13px; margin-bottom:10px; text-align:center; }
  .contrast-meta{ display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono', monospace; font-size:11px; color:#94A3B8; }
  .badge{ font-size:9px; font-weight:700; padding:3px 7px; border-radius:3px; letter-spacing:0.05em; }
  .badge.pass{ background: rgba(45,212,191,0.18); color:var(--temper); }
  .badge.fail{ background: rgba(255,53,3,0.18); color:var(--molten); }
</style>
</head>
<body>

<div class="section-tag">Alloy Mixer</div>
<h2>Pick a color. Get a palette that actually works.</h2>

<div class="alloy-controls">
  <span class="field-label">Base color</span>
  <input type="color" id="baseColor" value="#2DD4BF">
  <div class="pill-row" style="display:flex; gap:8px;">
    <button class="pill active" data-hex="#2DD4BF">Temper</button>
    <button class="pill" data-hex="#FF3503">Molten</button>
    <button class="pill" data-hex="#7C6AFF">Custom blue</button>
  </div>
</div>

<div class="swatch-row" id="swatchRow"></div>
<div class="contrast-grid" id="contrastGrid"></div>

<script>
  const baseColorInput = document.getElementById('baseColor');
  const presetPills = document.querySelectorAll('.pill');
  const swatchRow = document.getElementById('swatchRow');
  const contrastGrid = document.getElementById('contrastGrid');

  function hexToRgb(hex){
    const n = parseInt(hex.replace('#',''), 16);
    return { r: (n>>16)&255, g: (n>>8)&255, b: n&255 };
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }
  function mix(hex, target, amt){
    const a = hexToRgb(hex), b = hexToRgb(target);
    return rgbToHex(
      a.r + (b.r - a.r) * amt,
      a.g + (b.g - a.g) * amt,
      a.b + (b.b - a.b) * amt
    );
  }
  function relLuminance(hex){
    const {r,g,b} = hexToRgb(hex);
    const chan = [r,g,b].map(v => {
      v /= 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    return 0.2126*chan[0] + 0.7152*chan[1] + 0.0722*chan[2];
  }
  function contrastRatio(hex1, hex2){
    const l1 = relLuminance(hex1), l2 = relLuminance(hex2);
    const [lighter, darker] = l1 > l2 ? [l1,l2] : [l2,l1];
    return (lighter + 0.05) / (darker + 0.05);
  }

  function buildPalette(base){
    return [
      mix(base, '#0F172A', 0.65),
      mix(base, '#0F172A', 0.3),
      base,
      mix(base, '#E5E7EB', 0.35),
      mix(base, '#E5E7EB', 0.7),
    ];
  }

  function render(base){
    const palette = buildPalette(base);
    swatchRow.innerHTML = palette.map(hex =>
      `<div class="swatch" style="background:${hex}">${hex}</div>`
    ).join('');

    const pairs = [
      { bg: '#0F172A', label: 'On dark ink' },
      { bg: '#E5E7EB', label: 'On pale surface' },
      { bg: palette[2], label: 'On base color' },
    ];

    contrastGrid.innerHTML = pairs.map(pair => {
      const ratio = contrastRatio(base, pair.bg);
      const passAA = ratio >= 4.5;
      const passAAA = ratio >= 7;
      return `
        <div class="contrast-card">
          <div class="contrast-preview" style="background:${pair.bg}; color:${base};">Aa Text Sample</div>
          <div class="contrast-meta">
            <span>${pair.label} · ${ratio.toFixed(2)}:1</span>
            <span class="badge ${passAA ? 'pass' : 'fail'}">${passAA ? (passAAA ? 'AAA' : 'AA') : 'FAIL'}</span>
          </div>
        </div>`;
    }).join('');
  }

  baseColorInput.addEventListener('input', () => {
    presetPills.forEach(p => p.classList.remove('active'));
    render(baseColorInput.value);
  });

  presetPills.forEach(pill => {
    pill.addEventListener('click', () => {
      presetPills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      baseColorInput.value = pill.dataset.hex;
      render(pill.dataset.hex);
    });
  });

  render(baseColorInput.value);
</script>

</body>
</html>
